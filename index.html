<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Entrenamiento Aéreo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0a1f44;
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* 🔥 LOGO FAC DE FONDO */
        body::before {
            content: "";
            background: url('https://upload.wikimedia.org/wikipedia/commons/4/4c/Emblema_Fuerza_Aeroespacial_Colombiana.svg') no-repeat center center;
            background-size: 350px;
            opacity: 0.1; /* 👈 ajusta esto si lo quieres más visible */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0px 10px 25px rgba(0,0,0,0.4);
        }

        h2 {
            color: #0a1f44;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #0a1f44;
            border: none;
        }

        .btn-primary:hover {
            background-color: #132f63;
        }

        .btn-success {
            background-color: #1c3d7a;
            border: none;
        }

        .btn-success:hover {
            background-color: #0a1f44;
        }
    </style>
</head>

<body>

<div class="container mt-5">
    <div class="card p-4">
        <h2 class="text-center mb-4">Consulta de Entrenamiento Aéreo ✈️</h2>

        <input type="text" id="cedula" class="form-control mb-3" placeholder="Ingrese número de cédula">

        <button onclick="buscar()" class="btn btn-primary w-100">Buscar</button>

        <div id="resultado" class="mt-4"></div>
    </div>
</div>

<script>
function buscar() {
    const cedula = document.getElementById("cedula").value;
    const resultado = document.getElementById("resultado");

    if (cedula.trim() === "") {
        resultado.innerHTML = `<div class="alert alert-warning">Ingrese una cédula</div>`;
        return;
    }

    const datos = {
        "1019603560": {
            nombre: "Manuel Suarez",
            certificados: [
                {
                    nombre: "Certificado EPS",
                    archivo: "https://mfsuarezh5-ing.github.io/consulta-aerea/certificados/1019603560_eps.pdf"
                }
            ]
        }
    };

    if (datos[cedula]) {
        const persona = datos[cedula];

        let html = `
            <h4 class="text-center">${persona.nombre}</h4>
            <ul class="list-group mt-3">
        `;

        persona.certificados.forEach(cert => {
            html += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${cert.nombre}
                    <a href="${cert.archivo}" target="_blank" class="btn btn-sm btn-success">
                        Ver PDF
                    </a>
                </li>
            `;
        });

        html += "</ul>";

        resultado.innerHTML = html;

    } else {
        resultado.innerHTML = `
            <div class="alert alert-danger mt-3">
                No se encontró la cédula
            </div>
        `;
    }
}
</script>

</body>
</html>
